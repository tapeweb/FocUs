services:
  focus_postgres:
    container_name: ${POSTGRES_HOST}
    image: postgres:18-alpine

    volumes:
      # Postgres 18 declares VOLUME /var/lib/postgresql and keeps PGDATA in
      # /var/lib/postgresql/18/docker — mount the parent, not .../data.
      - focus_postgres_data:/var/lib/postgresql

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC

    ports:
      # host:container — override POSTGRES_PORT in .env if 5432 is taken locally
      - "${POSTGRES_PORT}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    networks:
      - focus_network

volumes:
  focus_postgres_data:
    name: focus_postgres_data

networks:
  focus_network:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge
